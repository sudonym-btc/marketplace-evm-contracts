[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
cache_path = "cache"
libs = ["../../node_modules"]
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=../../node_modules/@openzeppelin/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 32
